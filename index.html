
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle de Estoque - Supermercado</title>

  <style>

    :root {
      --primary: #1e3a8a;
      --secondary: #2563eb;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 30px auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    h1 {
      margin: 0;
      color: var(--primary);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--secondary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button.btn-warning {
      background-color: var(--warning);
    }

    button.btn-success {
      background-color: var(--success);
    }

    button.btn-danger {
      background-color: var(--danger);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #e2e8f0;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    .card-title {
      margin: 0 0 5px 0;
      font-size: 1.1rem;
      color: var(--primary);
    }

    .badge-unidade {
      align-self: flex-start;
      background-color: #e0e7ff;
      color: #3730a3;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .card-info {
      font-size: 0.9rem;
      color: #475569;
    }

    .card-control {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .card-control label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
    }

    .card-control input[type="number"] {
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    /* MODAL */

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: rgba(0, 0, 0, 0.5);

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 1000;
    }

    .modal {
      background: white;
      padding: 25px;
      border-radius: 8px;

      width: 90%;
      max-width: 450px;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal h2 {
      margin-top: 0;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #333;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;

      border: 1px solid #ccc;
      border-radius: 4px;

      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancel {
      background-color: var(--danger);
    }

  </style>

</head>

<body>

  <header>

    <h1>Controle de Estoque</h1>

    <div class="btn-group">

      <!-- BOTÃO INCLUIR PRODUTO -->
      <button onclick="abrirModalProduto()">
        Incluir Produto
      </button>

      <button onclick="carregarEstoque()">
        Carregar estoque
      </button>

      <button class="btn-warning" onclick="atualizarEstoque()">
        Atualizar estoque
      </button>

      <button class="btn-success" onclick="salvarEstoque()">
        Salvar estoque
      </button>

    </div>

  </header>


  <!-- LISTA DE PRODUTOS -->

  <main
    class="grid-container"
    id="gridProdutos">
  </main>


  <!-- MODAL PARA INCLUIR PRODUTO -->

  <div
    class="modal-overlay"
    id="modalProduto">

    <div class="modal">

      <h2>Incluir Novo Produto</h2>

      <form
        id="formProduto"
        onsubmit="incluirProduto(event)">

        <div class="form-group">

          <label for="nomeProduto">
            Nome do Produto:
          </label>

          <input
            type="text"
            id="nomeProduto"
            required>

        </div>


        <div class="form-group">

          <label for="fotoProduto">
            URL da Foto:
          </label>

          <input
            type="url"
            id="fotoProduto"
            placeholder="https://..."
            required>

        </div>


        <div class="form-group">

          <label for="precoCompra">
            Preço de Compra:
          </label>

          <input
            type="number"
            id="precoCompra"
            step="0.01"
            min="0"
            required>

        </div>


        <div class="form-group">

          <label for="precoVenda">
            Preço de Venda:
          </label>

          <input
            type="number"
            id="precoVenda"
            step="0.01"
            min="0"
            required>

        </div>


        <div class="form-group">

          <label for="quantidadeEstoque">
            Quantidade em Estoque:
          </label>

          <input
            type="number"
            id="quantidadeEstoque"
            min="0"
            step="1"
            required>

        </div>


        <div class="form-group">

          <label for="unidade">
            Unidade:
          </label>

          <input
            type="text"
            id="unidade"
            placeholder="Ex: Caixa, Pacote, Unidade..."
            required>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            class="btn-cancel"
            onclick="fecharModalProduto()">

            Cancelar

          </button>

          <button type="submit">

            Incluir Produto

          </button>

        </div>

      </form>

    </div>

  </div>


  <script>

    // Array que guarda os produtos
    let produtosData = [];


    // ========================================
    // CARREGAR ESTOQUE
    // ========================================

    async function carregarEstoque() {

      try {

        const response =
          await fetch('estoque.json');

        produtosData =
          await response.json();

        renderizarCards();

      }

      catch (error) {

        console.error(
          'Erro ao carregar o estoque:',
          error
        );

        alert(
          'Não foi possível carregar o arquivo estoque.json.'
        );

      }

    }


    // ========================================
    // RENDERIZAR CARDS
    // ========================================

    function renderizarCards() {

      const container =
        document.getElementById(
          'gridProdutos'
        );

      container.innerHTML = '';


      produtosData.forEach(produto => {

        const card =
          document.createElement('div');

        card.className = 'card';


        card.innerHTML = `

          <img
            src="${produto.foto}"
            alt="${produto.nome}">

          <div class="card-body">

            <span class="badge-unidade">
              ${produto.unidade}
            </span>

            <h3 class="card-title">
              ${produto.nome}
            </h3>

            <div class="card-info">
              <strong>Preço de Compra:</strong>
              R$ ${produto.precoCompra.toFixed(2)}
            </div>

            <div class="card-info">
              <strong>Preço de Venda:</strong>
              R$ ${produto.precoVenda.toFixed(2)}
            </div>

            <div class="card-info">
              <strong>Estoque Atual:</strong>
              ${produto.quantidadeEstoque}
            </div>

            <div class="card-control">

              <label
                for="mov-${produto.id}">

                Entrada / Saída
                (negativo):

              </label>

              <input
                type="number"
                id="mov-${produto.id}"
                value="0"
                step="1"
                placeholder="Ex: 5 ou -3">

            </div>

          </div>

        `;


        container.appendChild(card);

      });

    }


    // ========================================
    // ABRIR MODAL
    // ========================================

    function abrirModalProduto() {

      document
        .getElementById('modalProduto')
        .style.display = 'flex';

    }


    // ========================================
    // FECHAR MODAL
    // ========================================

    function fecharModalProduto() {

      document
        .getElementById('modalProduto')
        .style.display = 'none';


      document
        .getElementById('formProduto')
        .reset();

    }


    // ========================================
    // FUNÇÃO INCLUIR PRODUTO()
    // ========================================

    function incluirProduto(event) {

      // Impede o formulário de atualizar a página
      event.preventDefault();


      // Pega os valores digitados
      const nome =
        document
          .getElementById('nomeProduto')
          .value
          .trim();


      const foto =
        document
          .getElementById('fotoProduto')
          .value
          .trim();


      const precoCompra =
        parseFloat(
          document
            .getElementById('precoCompra')
            .value
        );


      const precoVenda =
        parseFloat(
          document
            .getElementById('precoVenda')
            .value
        );


      const quantidadeEstoque =
        parseInt(
          document
            .getElementById('quantidadeEstoque')
            .value,
          10
        );


      const unidade =
        document
          .getElementById('unidade')
          .value
          .trim();


      // Cria o novo produto
      const novoProduto = {

        id: Date.now(),

        nome: nome,

        foto: foto,

        precoCompra: precoCompra,

        precoVenda: precoVenda,

        quantidadeEstoque:
          quantidadeEstoque,

        unidade: unidade

      };


      // Adiciona o produto
      // ao array
      produtosData.push(novoProduto);


      // Atualiza a tela
      renderizarCards();


      // Fecha o formulário
      fecharModalProduto();


      // Mensagem
      alert(
        'Produto incluído com sucesso!'
      );

    }


    // ========================================
    // ATUALIZAR ESTOQUE
    // ========================================

    function atualizarEstoque() {

      produtosData.forEach(produto => {

        const campo =
          document.getElementById(
            `mov-${produto.id}`
          );


        if (campo) {

          const movimento =
            parseInt(
              campo.value,
              10
            ) || 0;


          produto.quantidadeEstoque +=
            movimento;


          if (
            produto.quantidadeEstoque < 0
          ) {

            produto.quantidadeEstoque = 0;

          }

        }

      });


      renderizarCards();


      alert(
        'Estoque atualizado com sucesso!'
      );

    }


    // ========================================
    // SALVAR ESTOQUE
    // ========================================

    function salvarEstoque() {

      const dataStr =
        "data:text/json;charset=utf-8," +
        encodeURIComponent(
          JSON.stringify(
            produtosData,
            null,
            2
          )
        );


      const downloadAnchor =
        document.createElement('a');


      downloadAnchor.setAttribute(
        "href",
        dataStr
      );


      downloadAnchor.setAttribute(
        "download",
        "estoque_atualizado.json"
      );


      document.body.appendChild(
        downloadAnchor
      );


      downloadAnchor.click();


      downloadAnchor.remove();

    }


    // ========================================
    // INICIAR
    // ========================================

    document.addEventListener(
      'DOMContentLoaded',
      carregarEstoque
    );

  </script>

</body>

</html>
