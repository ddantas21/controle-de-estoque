
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Estoque - Supermercado</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 15px 0;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .card p {
            margin: 8px 0;
        }

        .estoque {
            font-weight: bold;
            color: #27ae60;
        }

        .movimento {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal-content {
            background-color: white;
            width: 90%;
            max-width: 500px;
            margin: 5% auto;
            padding: 25px;
            border-radius: 10px;
        }

        .modal-content h2 {
            text-align: center;
        }

        .modal-content label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .modal-buttons {
            text-align: center;
            margin-top: 20px;
        }

        .btn-cancelar {
            background-color: #e74c3c;
        }

        .btn-cancelar:hover {
            background-color: #c0392b;
        }
    </style>
</head>

<body>

    <header>

        <h1>Controle de Estoque - Supermercado</h1>

        <button onclick="carregarEstoque()">
            Carregar estoque
        </button>

        <button onclick="abrirModalProduto()">
            Incluir Produto
        </button>

        <button onclick="atualizarEstoque()">
            Atualizar estoque
        </button>

        <button onclick="salvarEstoque()">
            Salvar estoque
        </button>

    </header>

    <main
        class="grid-container"
        id="gridProdutos">
    </main>


    <!-- MODAL PARA INCLUIR PRODUTO -->

    <div
        class="modal"
        id="modalProduto">

        <div class="modal-content">

            <h2>Incluir Produto</h2>

            <form
                id="formProduto"
                onsubmit="incluirProduto(event)">

                <label for="nomeProduto">
                    Nome do produto:
                </label>

                <input
                    type="text"
                    id="nomeProduto"
                    required>


                <label for="fotoProduto">
                    URL da foto:
                </label>

                <input
                    type="url"
                    id="fotoProduto"
                    required>


                <label for="precoCompra">
                    Preço de compra:
                </label>

                <input
                    type="number"
                    id="precoCompra"
                    step="0.01"
                    min="0"
                    required>


                <label for="precoVenda">
                    Preço de venda:
                </label>

                <input
                    type="number"
                    id="precoVenda"
                    step="0.01"
                    min="0"
                    required>


                <label for="quantidadeEstoque">
                    Quantidade em estoque:
                </label>

                <input
                    type="number"
                    id="quantidadeEstoque"
                    min="0"
                    required>


                <label for="unidade">
                    Unidade:
                </label>

                <input
                    type="text"
                    id="unidade"
                    required>


                <div class="modal-buttons">

                    <button type="submit">
                        Incluir Produto
                    </button>

                    <button
                        type="button"
                        class="btn-cancelar"
                        onclick="fecharModalProduto()">
                        Cancelar
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script>

        let produtosData = [];


        // ============================
        // CARREGAR ESTOQUE
        // ============================

        async function carregarEstoque() {

            try {

                const response =
                    await fetch("estoque.json");

                produtosData =
                    await response.json();

                renderizarCards();

            } catch (erro) {

                console.error(erro);

                alert(
                    "Erro ao carregar o arquivo estoque.json"
                );

            }

        }


        // ============================
        // MOSTRAR PRODUTOS
        // ============================

        function renderizarCards() {

            const container =
                document.getElementById(
                    "gridProdutos"
                );

            container.innerHTML = "";


            produtosData.forEach(
                function (produto) {

                    const card =
                        document.createElement("div");

                    card.className = "card";


                    card.innerHTML = `

                        <img
                            src="${produto.foto}"
                            alt="${produto.nome}"
                        >

                        <h2>
                            ${produto.nome}
                        </h2>

                        <p>
                            <strong>Unidade:</strong>
                            ${produto.unidade}
                        </p>

                        <p>
                            <strong>Preço de compra:</strong>
                            R$ ${produto.precoCompra.toFixed(2)}
                        </p>

                        <p>
                            <strong>Preço de venda:</strong>
                            R$ ${produto.precoVenda.toFixed(2)}
                        </p>

                        <p class="estoque">
                            Estoque:
                            ${produto.quantidadeEstoque}
                        </p>

                        <input
                            type="number"
                            class="movimento"
                            id="movimento-${produto.id}"
                            placeholder="Digite + ou - para movimentar o estoque"
                        >

                    `;


                    container.appendChild(card);

                }
            );

        }


        // ============================
        // INCLUIR PRODUTO
        // ============================

        function abrirModalProduto() {

            document.getElementById(
                "modalProduto"
            ).style.display = "block";

        }


        function fecharModalProduto() {

            document.getElementById(
                "modalProduto"
            ).style.display = "none";

        }


        function incluirProduto(event) {

            event.preventDefault();


            const nome =
                document.getElementById(
                    "nomeProduto"
                ).value.trim();


            const foto =
                document.getElementById(
                    "fotoProduto"
                ).value.trim();


            const precoCompra =
                parseFloat(
                    document.getElementById(
                        "precoCompra"
                    ).value
                );


            const precoVenda =
                parseFloat(
                    document.getElementById(
                        "precoVenda"
                    ).value
                );


            const quantidadeEstoque =
                parseInt(
                    document.getElementById(
                        "quantidadeEstoque"
                    ).value,
                    10
                );


            const unidade =
                document.getElementById(
                    "unidade"
                ).value.trim();


            const novoProduto = {

                id: Date.now(),

                nome: nome,

                foto: foto,

                precoCompra: precoCompra,

                precoVenda: precoVenda,

                quantidadeEstoque:
                    quantidadeEstoque,

                unidade: unidade

            };


            produtosData.push(
                novoProduto
            );


            renderizarCards();


            fecharModalProduto();


            document.getElementById(
                "formProduto"
            ).reset();


            alert(
                "Produto incluído com sucesso!"
            );

        }


        // ============================
        // ATUALIZAR ESTOQUE
        // ============================

        function atualizarEstoque() {

            produtosData.forEach(
                function (produto) {

                    const input =
                        document.getElementById(
                            `movimento-${produto.id}`
                        );


                    if (input) {

                        const movimento =
                            parseInt(
                                input.value
                            ) || 0;


                        produto.quantidadeEstoque +=
                            movimento;


                        if (
                            produto.quantidadeEstoque < 0
                        ) {

                            produto.quantidadeEstoque = 0;

                        }


                        input.value = "";

                    }

                }
            );


            renderizarCards();


            alert(
                "Estoque atualizado com sucesso!"
            );

        }


        // ============================
        // SALVAR ESTOQUE EM JSON
        // ============================

        function salvarEstoque() {

            const dadosJSON =
                JSON.stringify(
                    produtosData,
                    null,
                    2
                );


            const arquivo =
                new Blob(
                    [dadosJSON],
                    {
                        type:
                            "application/json"
                    }
                );


            const link =
                document.createElement("a");


            link.href =
                URL.createObjectURL(
                    arquivo
                );


            link.download =
                "estoque_atualizado.json";


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            URL.revokeObjectURL(
                link.href
            );


            alert(
                "Arquivo JSON salvo com sucesso!"
            );

        }

    </script>

</body>

</html>
